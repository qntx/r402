[package]
name = "r402-svm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Solana chain support for the x402 payment protocol."
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
telemetry = ["dep:tracing", "dep:tracing-core", "r402-core/telemetry"]

exact = ["r402-core/cache"]

client = [
    "dep:bincode",
    "dep:serde_json",
    "dep:solana-account",
    "dep:solana-client",
    "dep:solana-commitment-config",
    "dep:solana-compute-budget-interface",
    "dep:solana-message",
    "dep:solana-signature",
    "dep:solana-signer",
    "dep:solana-transaction",
    "dep:spl-token",
    "dep:spl-token-2022-interface",
]
server = ["dep:serde_json"]
facilitator = [
    "dep:bincode",
    "dep:serde_json",
    "dep:solana-account",
    "dep:solana-client",
    "dep:solana-commitment-config",
    "dep:solana-compute-budget-interface",
    "dep:solana-keypair",
    "dep:solana-message",
    "dep:solana-signature",
    "dep:solana-signer",
    "dep:solana-transaction",
    "dep:spl-token",
    "dep:spl-token-2022-interface",
    "dep:tokio",
    "r402-core/cache",
]
full = ["telemetry", "exact", "client", "server", "facilitator"]

[dependencies]
base64 = { workspace = true }
compact_str = { workspace = true }
futures-util = { workspace = true }
r402-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
solana-pubkey = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }

bincode = { workspace = true, optional = true }
solana-account = { workspace = true, optional = true }
solana-client = { workspace = true, optional = true }
solana-commitment-config = { workspace = true, optional = true }
solana-compute-budget-interface = { workspace = true, optional = true }
solana-keypair = { workspace = true, optional = true }
solana-message = { workspace = true, optional = true }
solana-signature = { workspace = true, optional = true }
solana-signer = { workspace = true, optional = true }
solana-transaction = { workspace = true, optional = true }
spl-token = { workspace = true, optional = true }
spl-token-2022-interface = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-core = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
