# cargo-deny policy for the r402 workspace.
# Run: cargo deny check all

[graph]
all-features = true

[advisories]
yanked       = "warn"
unmaintained = "none"
ignore       = [
  # crypto-bigint timing variability in ops intended constant-time
  # (subtraction, division, Montgomery mul, limb equality, inversion):
  # patched only in >= 0.7.6. The lockfile holds 0.5.5 via elliptic-curve
  # 0.13.8 / alloy-signer 2.6.1 (requires ^0.5.1; no alloy release on
  # elliptic-curve 0.14 / k256 0.14 exists yet) and 0.6.1 via
  # keetanetwork-crypto 0.3.0 (requires ^0.6.1; latest published release)
  # — neither upstream offers an in-range fix.
  # REACHABLE: the EVM signing path (alloy-signer-local -> k256 ->
  # elliptic-curve -> crypto-bigint 0.5.5) and the keeta path
  # (keetanetwork-crypto -> 0.6.1) run secret-scalar arithmetic through
  # the affected ops; exploitation needs a timing/microarchitectural side
  # channel (typically local or co-resident observation).
  # Revisit: remove when alloy moves to elliptic-curve 0.14 and
  # keetanetwork-* move off crypto-bigint 0.6; review by 2027-02-27.
  { id = "RUSTSEC-2026-0387", reason = "REACHABLE: EVM/keeta signing runs secret scalars through affected ops (crypto-bigint 0.5.5 via alloy-signer->elliptic-curve, 0.6.1 via keetanetwork-crypto); exploit needs a local/co-resident timing channel; no in-range patch; review by 2027-02-27" },
]

[licenses]
allow                = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# tonlib-core (r402-tvm) depends on nacl.
exceptions           = [
    { crate = "nacl", allow = ["LGPL-3.0-or-later"] },
]

[bans]
multiple-versions = "allow"
wildcards         = "allow"

[sources]
unknown-registry = "warn"
unknown-git      = "warn"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
