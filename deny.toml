# `cargo deny` configuration for the r402 workspace.
#
# Run locally:
#
#     cargo deny check all
#
# CI runs `cargo deny check all` via `.github/workflows/security.yml`.
# Schema reference: <https://embarkstudios.github.io/cargo-deny/checks/cfg.html>

[advisories]
# Reject yanked crates: a yank usually accompanies a security or
# correctness fix.
yanked = "deny"
# Advisories whose presence in the dependency graph is acceptable for
# this workspace. Each entry must include a written justification so the
# decision is auditable on review.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but feature-complete; alloy-rs/core#1086 was rejected upstream (DaniPopes, 2026-03-20) on the grounds that the crate works as-is and other deps still pull it in. No CVE, only an unmaintained advisory." },
]

[licenses]
# We only accept permissive, OSI-approved licences. New variants must be
# added explicitly so a copy-left dependency cannot slip in unnoticed.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
    "0BSD",
]
# 0.95 keeps SPDX expression confidence high enough to refuse heuristic
# matches, but lets `cargo deny` accept dual-licensed crates that publish
# their licence text verbatim.
confidence-threshold = 0.95
# Don't warn when an `allow`-listed licence is not seen in the current
# dependency graph — the list intentionally over-approximates so future
# deps don't trip the gate the moment they land.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Crates that are explicitly forbidden anywhere in the dependency tree.
# Empty by default; add forensic crates (e.g. `time = "0.1"` after the
# 2020 audit lifecycle) here as the project evolves.
deny = []
# Crates allowed to appear multiple times even when the workspace pulls
# in conflicting versions. Solana's transitive graph drags many of these
# in; tightening over time is a deliberate goal.
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow the x402 / siwx mirrors we vendor as git submodules.
allow-git = []
