[package]
name                   = "r402-extensions"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description            = "Protocol extension implementations for the x402 payment protocol."
keywords               = ["x402", "payment", "extensions", "http-402"]
categories             = [
    "api-bindings",
    "web-programming",
    "cryptography::cryptocurrencies",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default              = [
    "ext-bazaar",
    "ext-payment-id",
    "ext-eip2612",
    "ext-erc20-approval",
    "ext-builder-code",
    "ext-offer-receipt",
]
# TtlSet lives in r402-facilitator; only payment-identifier needs it.
cache                = ["dep:r402-facilitator"]
ext-bazaar           = []
# Off by default: facilitator GET /discovery client, not advertise.
ext-bazaar-discovery = [
    "ext-bazaar",
    "dep:r402-facilitator",
    "r402-facilitator/http-client",
    "dep:reqwest",
    "dep:thiserror",
    "dep:serde",
    "dep:url",
]
ext-payment-id       = ["cache", "dep:thiserror"]
ext-eip2612          = []
ext-erc20-approval   = []
ext-builder-code     = ["dep:thiserror", "dep:r402-client"]
ext-offer-receipt    = [
    "dep:thiserror",
    "dep:serde",
    "dep:base64",
    "dep:hex",
    "dep:bs58",
    "dep:p256",
    "dep:k256",
    "dep:ed25519-dalek",
    "dep:alloy-primitives",
    "dep:alloy-sol-types",
    "dep:alloy-signer",
]
siwx                 = [
    "dep:thiserror",
    "dep:url",
    "dep:siwx",
    "dep:siwx-evm",
    "dep:siwx-svm",
    "dep:time",
    "dep:hex",
    "dep:rand",
    "dep:bs58",
    "dep:r402-client",
    "dep:http",
]
all-extensions       = [
    "ext-bazaar",
    "ext-payment-id",
    "ext-eip2612",
    "ext-erc20-approval",
    "ext-builder-code",
    "ext-offer-receipt",
]

[dependencies]
compact_str   = { workspace = true }
r402-protocol = { workspace = true }
serde_json    = { workspace = true }

r402-client      = { workspace = true, optional = true }
r402-facilitator = { workspace = true, optional = true }
http             = { workspace = true, optional = true }
thiserror        = { workspace = true, optional = true }
url              = { workspace = true, optional = true }
reqwest          = { workspace = true, optional = true }
siwx             = { workspace = true, optional = true }
siwx-evm         = { workspace = true, optional = true }
siwx-svm         = { workspace = true, optional = true }
time             = { workspace = true, optional = true }
hex              = { workspace = true, optional = true }
rand             = { workspace = true, optional = true }
bs58             = { workspace = true, optional = true }
serde            = { workspace = true, optional = true }
base64           = { workspace = true, optional = true }
p256             = { workspace = true, optional = true }
k256             = { workspace = true, optional = true }
ed25519-dalek    = { workspace = true, optional = true }
alloy-primitives = { workspace = true, optional = true }
alloy-sol-types  = { workspace = true, optional = true }
alloy-signer     = { workspace = true, optional = true }

[dev-dependencies]
serde_json         = { workspace = true }
alloy-signer       = { workspace = true }
alloy-signer-local = { workspace = true }
bs58               = { workspace = true }
compact_str        = { workspace = true }
ed25519-dalek      = { workspace = true }
http               = { workspace = true }
r402-client        = { workspace = true }
tokio              = { workspace = true, features = ["macros", "rt"] }
wiremock           = { workspace = true }

[[test]]
name              = "bazaar"
required-features = ["ext-bazaar"]

[[test]]
name              = "bazaar_discovery"
required-features = ["ext-bazaar-discovery"]

[[test]]
name              = "siwx"
required-features = ["siwx"]

[[test]]
name              = "builder_code"
required-features = ["ext-builder-code"]

[[test]]
name              = "offer_receipt"
required-features = ["ext-offer-receipt"]

[lints]
workspace = true
