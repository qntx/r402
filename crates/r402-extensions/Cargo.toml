[package]
name = "r402-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Protocol extension implementations for the x402 payment protocol."
keywords = ["x402", "payment", "extensions", "http-402"]
categories = [
    "api-bindings",
    "web-programming",
    "cryptography::cryptocurrencies",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["ext-bazaar", "ext-payment-id", "ext-eip2612", "ext-erc20-approval"]
# TtlSet lives in r402-facilitator; only payment-identifier needs it.
cache = ["dep:r402-facilitator"]
ext-bazaar = []
ext-payment-id = ["cache", "dep:thiserror"]
ext-eip2612 = []
ext-erc20-approval = []
siwx = ["dep:thiserror"]
all-extensions = [
    "ext-bazaar",
    "ext-payment-id",
    "ext-eip2612",
    "ext-erc20-approval",
]

[dependencies]
compact_str = { workspace = true }
r402-protocol = { workspace = true }
serde_json = { workspace = true }

r402-facilitator = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[[test]]
name = "bazaar"
required-features = ["ext-bazaar"]

[[test]]
name = "siwx"
required-features = ["siwx"]

[lints]
workspace = true
