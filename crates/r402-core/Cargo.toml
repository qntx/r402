[package]
name = "r402-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core types, traits, and wire formats for the x402 payment protocol."
readme = "README.md"
keywords = ["x402", "payment", "protocol", "wire-format", "http-402"]
categories = [
    "api-bindings",
    "encoding",
    "data-structures",
    "web-programming",
    "cryptography::cryptocurrencies",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

telemetry = ["dep:tracing", "dep:tracing-core"]
cache = ["dep:moka"]
# Stable metric-name catalogue for the `metrics` facade. Disabled by
# default; enable when downstream code installs a recorder so the
# constants and instrumentation hooks become available.
metrics = ["dep:metrics"]

ext-bazaar = []
ext-payment-id = ["cache"]
ext-eip2612 = []
ext-erc20-approval = []
ext-agent-identity = []

all-extensions = [
    "ext-bazaar",
    "ext-payment-id",
    "ext-eip2612",
    "ext-erc20-approval",
    "ext-agent-identity",
]

full = ["telemetry", "cache", "metrics", "all-extensions"]

[dependencies]
base64 = { workspace = true }
compact_str = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
thiserror = { workspace = true }

metrics = { workspace = true, optional = true }
moka = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-core = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
