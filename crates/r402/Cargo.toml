[package]
name = "r402"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "x402 Payment Protocol SDK for Rust — umbrella crate."
keywords = ["x402", "payment", "web3", "http-402", "sdk"]
categories = [
    "api-bindings",
    "web-programming",
    "cryptography::cryptocurrencies",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["evm", "http"]
evm = ["dep:r402-evm", "r402-evm/client", "r402-evm/server"]
http = ["dep:r402-http", "r402-http/client", "r402-http/server"]

[dependencies]
r402-evm = { workspace = true, optional = true }
r402-http = { workspace = true, optional = true }

[lints]
workspace = true
