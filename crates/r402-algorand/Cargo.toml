[package]
name = "r402-algorand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Algorand chain support for the x402 payment protocol."
readme = "README.md"
keywords = ["x402", "payment", "algorand", "asa", "usdc"]
categories = [
    "api-bindings",
    "cryptography::cryptocurrencies",
    "web-programming",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
telemetry = ["dep:tracing", "dep:tracing-core", "r402-core/telemetry"]
client = ["dep:ed25519-dalek", "dep:reqwest", "dep:serde_json"]
server = ["dep:serde_json"]
facilitator = [
    "dep:ed25519-dalek",
    "dep:reqwest",
    "dep:serde_json",
    "dep:tokio",
    "r402-core/cache",
]
full = ["telemetry", "client", "server", "facilitator"]

[dependencies]
base64 = { workspace = true }
compact_str = { workspace = true }
data-encoding = "2"
r402-core = { workspace = true }
serde = { workspace = true }
sha2 = "0.11"
thiserror = { workspace = true }

ed25519-dalek = { version = "2", optional = true }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }
tracing = { workspace = true, optional = true }
tracing-core = { workspace = true, optional = true }

[dev-dependencies]
ed25519-dalek = { version = "2" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }

[lints]
workspace = true
