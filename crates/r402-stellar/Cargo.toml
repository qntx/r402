[package]
name = "r402-stellar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Stellar chain support for the x402 payment protocol."
readme = "README.md"
keywords = ["x402", "payment", "stellar", "soroban", "usdc"]
categories = [
    "api-bindings",
    "cryptography::cryptocurrencies",
    "web-programming",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
telemetry = ["dep:tracing", "dep:tracing-core", "r402-core/telemetry"]
client = [
    "dep:ed25519-dalek",
    "dep:reqwest",
    "dep:serde_json",
    "dep:sha2",
    "dep:stellar-rpc-client",
    "dep:stellar-xdr",
]
server = ["dep:serde_json"]
facilitator = [
    "dep:ed25519-dalek",
    "dep:reqwest",
    "dep:serde_json",
    "dep:sha2",
    "dep:stellar-rpc-client",
    "dep:stellar-xdr",
    "r402-core/cache",
]
full = ["telemetry", "client", "server", "facilitator"]

[dependencies]
compact_str = { workspace = true }
r402-core = { workspace = true }
serde = { workspace = true }
stellar-strkey = { workspace = true }
thiserror = { workspace = true }

ed25519-dalek = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
stellar-rpc-client = { workspace = true, optional = true }
stellar-xdr = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-core = { workspace = true, optional = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
stellar-xdr = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }

[lints]
workspace = true
