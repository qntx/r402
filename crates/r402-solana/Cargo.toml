[package]
name = "r402-solana"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Solana chain support for the x402 payment protocol."
readme = "README.md"
keywords = ["x402", "payment", "solana", "spl-token"]
categories = [
    "api-bindings",
    "cryptography::cryptocurrencies",
    "web-programming",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
telemetry = ["dep:tracing", "dep:tracing-core", "r402-core/telemetry"]

client = [
    "dep:bincode",
    "dep:rand",
    "dep:solana-account",
    "dep:solana-client",
    "dep:solana-commitment-config",
    "dep:solana-compute-budget-interface",
    "dep:solana-instruction",
    "dep:solana-message",
    "dep:solana-signature",
    "dep:solana-signer",
    "dep:solana-transaction",
    "dep:spl-token",
    "dep:spl-token-2022-interface",
]
server = [
    "dep:solana-client",
    "dep:solana-commitment-config",
    "dep:solana-keypair",
    "dep:solana-signature",
    "dep:solana-signer",
    "dep:tokio",
]
facilitator = [
    "dep:bincode",
    "dep:rand",
    "dep:sha2",
    "dep:solana-account",
    "dep:solana-client",
    "dep:solana-commitment-config",
    "dep:solana-compute-budget-interface",
    "dep:solana-instruction",
    "dep:solana-keypair",
    "dep:solana-message",
    "dep:solana-signature",
    "dep:solana-signer",
    "dep:solana-transaction",
    "dep:spl-token",
    "dep:spl-token-2022-interface",
    "dep:tokio",
    "r402-core/cache",
]
full = ["telemetry", "client", "server", "facilitator"]

[dependencies]
base64 = { workspace = true }
compact_str = { workspace = true }
futures-util = { workspace = true }
r402-core = { workspace = true }
rand = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { version = "0.10", optional = true }
solana-pubkey = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }

bincode = { workspace = true, optional = true }
solana-account = { workspace = true, optional = true }
solana-client = { workspace = true, optional = true }
solana-commitment-config = { workspace = true, optional = true }
solana-compute-budget-interface = { workspace = true, optional = true }
solana-instruction = { version = "3", optional = true }
solana-keypair = { workspace = true, optional = true }
solana-message = { workspace = true, optional = true }
solana-signature = { workspace = true, optional = true }
solana-signer = { workspace = true, optional = true }
solana-transaction = { workspace = true, optional = true }
spl-token = { workspace = true, optional = true }
spl-token-2022-interface = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-core = { workspace = true, optional = true }

[dev-dependencies]
hex = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
