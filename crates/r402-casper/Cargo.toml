[package]
name = "r402-casper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Casper chain support for the x402 payment protocol."
keywords = ["x402", "payment", "casper", "cep18", "cspr"]
categories = [
    "api-bindings",
    "cryptography::cryptocurrencies",
    "web-programming",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
telemetry = ["dep:tracing", "dep:tracing-core"]
client = ["dep:r402-client", "dep:rand", "dep:sha3"]
server = ["dep:r402-server"]
facilitator = [
    "dep:r402-facilitator",
    "dep:reqwest",
    "dep:url",
]
full = ["telemetry", "client", "server", "facilitator"]

[dependencies]
blake2 = { workspace = true }
compact_str = { workspace = true }
r402-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

r402-client = { workspace = true, optional = true }
r402-facilitator = { workspace = true, optional = true }
r402-server = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha3 = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-core = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
r402-client = { workspace = true }
r402-facilitator = { workspace = true }
r402-server = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
sha3 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
url = { workspace = true }

[lints]
workspace = true
