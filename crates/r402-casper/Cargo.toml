[package]
name = "r402-casper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Casper chain support for the x402 payment protocol."
readme = "README.md"
keywords = ["x402", "payment", "casper", "cep18", "cspr"]
categories = [
    "api-bindings",
    "cryptography::cryptocurrencies",
    "web-programming",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
telemetry = ["dep:tracing", "r402-core/telemetry"]

exact = []

client = ["dep:serde_json"]
server = ["dep:serde_json"]
facilitator = ["dep:serde_json", "dep:url"]
full = ["telemetry", "exact", "client", "server", "facilitator"]

[dependencies]
compact_str = { workspace = true }
r402-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }

tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
