[package]
name                   = "r402-http"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description            = "HTTP transport layer for the x402 payment protocol."
keywords               = ["x402", "payment", "http", "axum", "reqwest"]
categories             = [
    "web-programming::http-server",
    "web-programming::http-client",
    "api-bindings",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default      = []
client       = [
    "dep:async-trait",
    "dep:http",
    "dep:r402-client",
    "dep:r402-protocol",
    "dep:reqwest",
    "dep:reqwest-middleware",
    "dep:serde_json",
]
server       = [
    "dep:axum-core",
    "dep:compact_str",
    "dep:http",
    "dep:r402-extensions",
    "r402-extensions/ext-eip2612",
    "r402-extensions/ext-erc20-approval",
    "dep:r402-facilitator",
    "dep:r402-protocol",
    "dep:r402-server",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tower",
    "dep:url",
]
siwx         = ["server", "dep:r402-extensions", "r402-extensions/siwx", "dep:time", "dep:tracing"]
siwx-eip1271 = ["siwx", "r402-extensions/siwx-eip1271"]

[dependencies]
async-trait        = { workspace = true, optional = true }
axum-core          = { workspace = true, optional = true }
compact_str        = { workspace = true, optional = true }
http               = { workspace = true, optional = true }
r402-client        = { workspace = true, optional = true }
r402-extensions    = { workspace = true, optional = true, default-features = false }
r402-facilitator   = { workspace = true, optional = true, features = ["http-client"] }
r402-protocol      = { workspace = true, optional = true }
r402-server        = { workspace = true, optional = true }
reqwest            = { workspace = true, optional = true }
reqwest-middleware = { workspace = true, optional = true }
serde_json         = { workspace = true, optional = true }
thiserror          = { workspace = true, optional = true }
time               = { workspace = true, optional = true }
tower              = { workspace = true, optional = true }
tracing            = { workspace = true, optional = true }
url                = { workspace = true, optional = true }

[dev-dependencies]
alloy-network      = { workspace = true }
alloy-primitives   = { workspace = true }
alloy-provider     = { workspace = true }
alloy-signer       = { workspace = true }
alloy-signer-local = { workspace = true }
axum               = "0.8"
axum-core          = { workspace = true }
compact_str        = { workspace = true }
http               = { workspace = true }
http-body-util     = "0.1"
r402-client        = { workspace = true }
r402-evm           = { workspace = true, features = ["client", "server", "facilitator"] }
r402-extensions    = { workspace = true, default-features = false, features = [
    "ext-eip2612",
    "ext-erc20-approval",
    "siwx",
] }
r402-facilitator   = { workspace = true, features = ["http-client"] }
r402-protocol      = { workspace = true }
r402-server        = { workspace = true }
reqwest            = { workspace = true }
reqwest-middleware = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
tower              = { workspace = true }
tracing            = { workspace = true }
url                = { workspace = true }
wiremock           = { workspace = true }

[[test]]
name              = "buyer"
required-features = ["client"]

[[test]]
name              = "sequential"
required-features = ["server"]

[[test]]
name              = "concurrent"
required-features = ["server"]

[[test]]
name              = "background"
required-features = ["server"]

[[test]]
name              = "headers"
required-features = ["server"]

[[test]]
name              = "boundary"
required-features = ["server"]

[[test]]
name              = "overrides"
required-features = ["server"]

[[test]]
name              = "upfront"
required-features = ["server"]

[[test]]
name              = "build"
required-features = ["server"]

[[test]]
name              = "siwx"
required-features = ["server", "siwx"]

[[test]]
name              = "siwx_eip1271"
required-features = ["siwx-eip1271"]

[[test]]
name              = "e2e_exact_evm"
required-features = ["server", "client"]

[lints]
workspace = true
