[package]
name = "r402-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HTTP transport layer for the x402 payment protocol."
readme = "README.md"
keywords = ["x402", "payment", "http", "axum", "reqwest"]
categories = [
    "web-programming::http-server",
    "web-programming::http-client",
    "api-bindings",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
client = [
    "dep:async-trait",
    "dep:http",
    "dep:r402-core",
    "dep:reqwest",
    "dep:reqwest-middleware",
    "dep:serde_json",
]
server = [
    "dep:axum-core",
    "dep:http",
    "dep:httpdate",
    "dep:r402-core",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
    "dep:tower",
    "dep:url",
]
telemetry = ["dep:r402-core", "dep:tracing", "r402-core/telemetry"]
# Backend-agnostic metrics emission via the `metrics` facade. See the
# `r402_core::metrics` module for the catalogue of metric names. Operators
# install a recorder (e.g. `metrics-exporter-prometheus`) at startup; with
# no recorder the macros expand to no-ops.
metrics = ["dep:r402-core", "dep:metrics", "r402-core/metrics"]
full = ["client", "server", "telemetry", "metrics"]

[dependencies]
compact_str = { workspace = true }
r402-core = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

async-trait = { workspace = true, optional = true }
axum-core = { workspace = true, optional = true }
http = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
reqwest-middleware = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "time"], optional = true }
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
