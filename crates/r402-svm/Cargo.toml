[package]
name = "r402-svm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SVM (Solana) chain support for the x402 payment protocol."
keywords = ["x402", "payment", "solana", "svm", "spl-token"]
categories = [
    "api-bindings",
    "cryptography::cryptocurrencies",
    "web-programming",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
telemetry = ["dep:tracing", "dep:tracing-core"]

client = [
    "dep:bincode",
    "dep:hex",
    "dep:r402-client",
    "dep:rand",
    "dep:solana-account",
    "dep:solana-client",
    "dep:solana-commitment-config",
    "dep:solana-compute-budget-interface",
    "dep:solana-message",
    "dep:solana-signature",
    "dep:solana-signer",
    "dep:solana-transaction",
    "dep:spl-token",
    "dep:spl-token-2022-interface",
]
server = [
    "dep:r402-server",
    "dep:solana-client",
    "dep:solana-commitment-config",
    "dep:solana-signature",
    "dep:solana-signer",
]
facilitator = [
    "dep:bincode",
    "dep:base64",
    "dep:bs58",
    "dep:futures-util",
    "dep:r402-facilitator",
    "dep:rand",
    "dep:sha2",
    "dep:solana-account",
    "dep:solana-client",
    "dep:solana-commitment-config",
    "dep:solana-compute-budget-interface",
    "dep:solana-keypair",
    "dep:solana-message",
    "dep:solana-signature",
    "dep:solana-signer",
    "dep:solana-transaction",
    "dep:spl-token",
    "dep:spl-token-2022-interface",
    "dep:tokio",
]
full = ["telemetry", "client", "server", "facilitator"]

[dependencies]
compact_str = { workspace = true }
r402-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
solana-pubkey = { workspace = true }
thiserror = { workspace = true }

base64 = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
bs58 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
r402-client = { workspace = true, optional = true }
r402-facilitator = { workspace = true, optional = true }
r402-server = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
solana-account = { workspace = true, optional = true }
solana-client = { workspace = true, optional = true }
solana-commitment-config = { workspace = true, optional = true }
solana-compute-budget-interface = { workspace = true, optional = true }
solana-keypair = { workspace = true, optional = true }
solana-message = { workspace = true, optional = true }
solana-signature = { workspace = true, optional = true }
solana-signer = { workspace = true, optional = true }
solana-transaction = { workspace = true, optional = true }
spl-token = { workspace = true, optional = true }
spl-token-2022-interface = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-core = { workspace = true, optional = true }

[dev-dependencies]
hex = { workspace = true }
r402-facilitator = { workspace = true }
r402-protocol = { workspace = true }
r402-server = { workspace = true }
serde_json = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-pubkey = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
