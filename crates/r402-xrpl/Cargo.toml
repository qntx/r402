[package]
name = "r402-xrpl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "XRPL chain support for the x402 payment protocol."
readme = "README.md"
keywords = ["x402", "payment", "xrpl", "xrp", "rlusd"]
categories = [
    "api-bindings",
    "cryptography::cryptocurrencies",
    "web-programming",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
telemetry = ["dep:tracing", "dep:tracing-core", "r402-core/telemetry"]
client = [
    "xrpl-rust/std",
    "xrpl-rust/json-rpc",
    "dep:hex",
    "dep:reqwest",
    "dep:serde_json",
    "dep:sha2",
    "dep:tokio",
    "dep:url",
]
server = ["dep:serde_json"]
facilitator = [
    "xrpl-rust/std",
    "xrpl-rust/json-rpc",
    "dep:hex",
    "dep:reqwest",
    "dep:serde_json",
    "dep:sha2",
    "dep:tokio",
    "dep:url",
    "r402-core/cache",
]
full = ["telemetry", "client", "server", "facilitator"]

[dependencies]
compact_str = { workspace = true }
r402-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# `std` + `json-rpc` are feature-gated: wallet and websocket stay off.
xrpl-rust = { workspace = true, default-features = false, features = ["core", "models"] }

hex = { version = "0.4", default-features = false, features = ["alloc"], optional = true }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.10", default-features = false, features = ["std"], optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }
tracing = { workspace = true, optional = true }
tracing-core = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
hex = { version = "0.4", default-features = false, features = ["alloc"] }
serde_json = { workspace = true }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
wiremock = { workspace = true }
xrpl-rust = { workspace = true, default-features = false, features = ["std", "core", "models", "json-rpc"] }

[lints]
workspace = true
