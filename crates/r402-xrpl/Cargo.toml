[package]
name                   = "r402-xrpl"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description            = "XRPL chain support for the x402 payment protocol."
keywords               = ["x402", "payment", "xrpl", "xrp", "rlusd"]
categories             = [
    "api-bindings",
    "cryptography::cryptocurrencies",
    "web-programming",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default     = []
telemetry   = ["dep:tracing", "dep:tracing-core"]
client      = [
    "dep:hex",
    "dep:r402-client",
    "dep:reqwest",
    "dep:rust_decimal",
    "dep:sha2",
    "dep:tokio",
    "dep:url",
]
server      = ["dep:r402-server"]
facilitator = [
    "dep:hex",
    "dep:r402-facilitator",
    "dep:reqwest",
    "dep:rust_decimal",
    "dep:sha2",
    "dep:tokio",
    "dep:url",
]
full        = ["telemetry", "client", "server", "facilitator"]

[dependencies]
compact_str   = { workspace = true }
r402-protocol = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
# core + models only. Transport is workspace reqwest; do not enable wallet,
# websocket, std, or json-rpc (std pulls tungstenite/reqwest 0.12).
xrpl-rust     = { workspace = true, default-features = false, features = ["core", "models"] }

hex              = { workspace = true, optional = true }
r402-client      = { workspace = true, optional = true }
r402-facilitator = { workspace = true, optional = true }
r402-server      = { workspace = true, optional = true }
reqwest          = { workspace = true, optional = true }
rust_decimal     = { workspace = true, optional = true }
sha2             = { workspace = true, optional = true }
tokio            = { workspace = true, optional = true, features = ["time"] }
tracing          = { workspace = true, optional = true }
tracing-core     = { workspace = true, optional = true }
url              = { workspace = true, optional = true }

[dev-dependencies]
hex        = { workspace = true }
reqwest    = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
tokio      = { workspace = true, features = ["macros", "rt", "time"] }
wiremock   = { workspace = true }
xrpl-rust  = { workspace = true, default-features = false, features = ["core", "models"] }

[lints]
workspace = true
