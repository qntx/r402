[package]
name                   = "r402-near"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description            = "NEAR chain support for the x402 payment protocol."
keywords               = ["x402", "payment", "near", "nep141", "usdc"]
categories             = [
    "api-bindings",
    "cryptography::cryptocurrencies",
    "web-programming",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default     = []
telemetry   = ["dep:tracing", "dep:tracing-core"]
client      = [
    "dep:borsh",
    "dep:near-crypto",
    "dep:near-jsonrpc-client",
    "dep:near-jsonrpc-primitives",
    "dep:near-primitives",
    "dep:r402-client",
    "dep:reqwest",
]
server      = ["dep:r402-server"]
facilitator = [
    "dep:borsh",
    "dep:hex",
    "dep:near-crypto",
    "dep:near-jsonrpc-client",
    "dep:near-jsonrpc-primitives",
    "dep:near-primitives",
    "dep:r402-facilitator",
    "dep:reqwest",
    "dep:sha2",
]
full        = ["telemetry", "client", "server", "facilitator"]

[dependencies]
base64        = { workspace = true }
compact_str   = { workspace = true }
r402-protocol = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }

borsh                   = { workspace = true, optional = true }
hex                     = { workspace = true, optional = true }
near-crypto             = { workspace = true, optional = true }
near-jsonrpc-client     = { workspace = true, optional = true }
near-jsonrpc-primitives = { workspace = true, optional = true }
near-primitives         = { workspace = true, optional = true }
# Same reqwest line as near-jsonrpc-client 0.22. Do not use workspace 0.13.
reqwest                 = { version = "0.12", default-features = false, features = ["json"], optional = true }
r402-client             = { workspace = true, optional = true }
r402-facilitator        = { workspace = true, optional = true }
r402-server             = { workspace = true, optional = true }
sha2                    = { workspace = true, optional = true }
tracing                 = { workspace = true, optional = true }
tracing-core            = { workspace = true, optional = true }

[dev-dependencies]
hex             = { workspace = true }
near-crypto     = { workspace = true, features = ["rand"] }
near-primitives = { workspace = true }
serde_json      = { workspace = true }
sha2            = { workspace = true }
tokio           = { workspace = true, features = ["macros", "rt"] }
wiremock        = { workspace = true }

[lints]
workspace = true
