[package]
name = "r402-keeta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Keeta chain support for the x402 payment protocol."
readme = "README.md"
keywords = ["x402", "payment", "keeta", "usdc"]
categories = [
    "api-bindings",
    "cryptography::cryptocurrencies",
    "web-programming",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
telemetry = ["dep:tracing", "dep:tracing-core", "r402-core/telemetry"]
client = [
    "dep:keetanetwork-block",
    "dep:keetanetwork-client",
    "dep:keetanetwork-crypto",
    "dep:serde_json",
]
server = []
facilitator = [
    "dep:keetanetwork-block",
    "dep:keetanetwork-client",
    "dep:keetanetwork-crypto",
    "dep:serde_json",
    "dep:tokio",
    "r402-core/cache",
]
full = ["telemetry", "client", "server", "facilitator"]

[dependencies]
base64 = { workspace = true }
compact_str = { workspace = true }
keetanetwork-account = { workspace = true }
r402-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

keetanetwork-block = { workspace = true, optional = true }
keetanetwork-client = { workspace = true, optional = true }
keetanetwork-crypto = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-core = { workspace = true, optional = true }

[dev-dependencies]
keetanetwork-block = { workspace = true }
keetanetwork-client = { workspace = true }
keetanetwork-crypto = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
