[package]
name                   = "r402-avm"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description            = "AVM (Algorand) chain support for the x402 payment protocol."
keywords               = ["x402", "payment", "algorand", "avm", "asa"]
categories             = [
    "api-bindings",
    "cryptography::cryptocurrencies",
    "web-programming",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default     = []
telemetry   = ["dep:tracing", "dep:tracing-core"]
client      = ["dep:ed25519-dalek", "dep:r402-client", "dep:reqwest"]
server      = ["dep:r402-server"]
facilitator = [
    "dep:ed25519-dalek",
    "dep:r402-facilitator",
    "dep:reqwest",
    "dep:tokio",
]
full        = ["telemetry", "client", "server", "facilitator"]

[dependencies]
base64        = { workspace = true }
compact_str   = { workspace = true }
data-encoding = "2"
r402-protocol = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
sha2          = { workspace = true }
thiserror     = { workspace = true }

ed25519-dalek    = { workspace = true, optional = true }
r402-client      = { workspace = true, optional = true }
r402-facilitator = { workspace = true, optional = true }
r402-server      = { workspace = true, optional = true }
reqwest          = { workspace = true, optional = true }
tokio            = { workspace = true, optional = true, features = ["time"] }
tracing          = { workspace = true, optional = true }
tracing-core     = { workspace = true, optional = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
serde_json    = { workspace = true }
tokio         = { workspace = true, features = ["macros", "rt"] }
wiremock      = { workspace = true }

[lints]
workspace = true
