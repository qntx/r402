[package]
name = "r402-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Resource server, paymentFlow, and SettlementMode scheduler for the x402 payment protocol."
keywords = ["x402", "payment", "server", "http-402"]
categories = [
    "api-bindings",
    "web-programming",
    "cryptography::cryptocurrencies",
    "asynchronous",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
telemetry = ["dep:tracing"]
metrics = ["dep:metrics"]

[dependencies]
compact_str = { workspace = true }
r402-facilitator = { workspace = true }
r402-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }

metrics = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
