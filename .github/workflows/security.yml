name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 06:00 UTC so CVEs published in the dependency tree
    # surface within 24h regardless of merge cadence.
    - cron: "0 6 * * *"

# Cancel in-flight runs on the same ref to avoid wasting compute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `cargo audit` against the RustSec advisory DB. Fails the build on any
  # advisory severity so security regressions cannot land in main.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # `cargo deny` enforces licence, advisory, source, and ban policies. The
  # configuration lives in `deny.toml` at the workspace root.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Run every check group; tighten via `deny.toml` when needed.
          command: check all
