name: Publish to crates.io

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: qntx/workflows/.github/workflows/publish-crates.yml@v2.0.0
    permissions:
      contents: read
    with:
      packages: "r402-protocol r402-client r402-facilitator r402-server r402-extensions r402-evm r402-svm r402-tron r402-casper r402-near r402-xrpl r402-hedera r402-avm r402-aptos r402-keeta r402-tvm r402-stellar r402-concordium r402-http r402-mcp r402"
      apt-packages: protobuf-compiler
      timeout-minutes: 90
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
