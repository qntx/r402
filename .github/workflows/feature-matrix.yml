name: Feature Matrix

# Purpose: every published feature combination on every workspace crate must
# build standalone. The default `cargo check --workspace --all-features`
# only proves *one* combination compiles; cross-feature regressions slip
# through until a downstream crate that disables a default feature breaks.
# `cargo hack --feature-powerset` enumerates every legal subset.
#
# Runs on push / PR to `main` and weekly so feature-flag drift in upstream
# dependencies (`alloy`, `solana-*`, `tokio`) is caught quickly.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  feature-powerset:
    name: cargo hack --feature-powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-hack

      # The powerset can grow quickly; we use `--no-dev-deps` to skip
      # dev-dependency permutations (covered by the regular test job) and
      # `--depth 2` to bound combinations to subsets of size ≤ 2 plus the
      # all-features case. This catches the common "one feature flips on"
      # regression pattern without combinatorial explosion.
      - name: Check every feature subset (depth ≤ 2)
        run: cargo hack check --workspace --feature-powerset --no-dev-deps --depth 2

      # Belt-and-braces: also run the empty-features and full-features ends
      # of the spectrum explicitly, because `--depth 2` excludes them.
      - name: Check no default features
        run: cargo hack check --workspace --no-default-features

      - name: Check all features
        run: cargo check --workspace --all-features
